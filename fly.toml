# app = "имя-приложения" задаёт `fly create`/`fly launch`; до первого деплоя
# оно может быть занято чужим — тогда меняем здесь же.
primary_region = 'hel'

[build]
dockerfile = 'Dockerfile'

[env]
PORT = '8080'
HOST = '0.0.0.0'
DATABASE_URL = 'file:/data/card.db'
STATIC_DIR = '/app/packages/web/out'
GRAPHIQL = 'true'
CARD_APP_VERSION = '1.0.0'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[http_service.checks]
interval = '30s'
timeout = '5s'
grace_period = '30s'
method = 'get'
path = '/healthz'

[[mounts]]
source = 'card_data'
destination = '/data'
initial_size_mb = 1024

[[vm]]
size = 'shared-cpu-1x'
memory = '256mb'
cpus = 1
